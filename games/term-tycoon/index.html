const SKEY = "introsw-tycoon-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DATA.s), iterations: DATA.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.i) }, key, b64(DATA.c));
  return new TextDecoder().decode(plain);
}
async function tryOpen(pw, quiet) {
  const fb = document.getElementById("fb");
  if (!window.crypto || !crypto.subtle) { fb.textContent = "This browser can't open the game here. 此瀏覽器無法開啟。"; return; }
  if (!quiet) fb.textContent = "Opening… 開啟中…";
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem(SKEY, pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem(SKEY); } catch (e2) {}
    if (!quiet) { fb.textContent = "Wrong password. 密碼錯誤。"; document.getElementById("pw").select(); }
    else fb.textContent = "";
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const pw = norm(document.getElementById("pw").value);
  if (pw) tryOpen(pw, false);
});
/* Reloading the page in the same tab reopens the game without typing the password again. */
try { const saved = sessionStorage.getItem(SKEY); if (saved) tryOpen(saved, true); } catch (e) {}
