<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety Net Dispatch · Printable sheets 列印用卡片</title>
<style>
@page{size:A4 portrait;margin:8mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;color:#000;background:#ddd}
.bar{background:#16233b;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar button{font:700 16px inherit;padding:8px 14px;border-radius:8px;border:0;cursor:pointer}
.page{width:194mm;height:281mm;margin:10px auto;background:#fff;display:flex;flex-direction:column;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.card{flex:1;height:100%;padding:8mm 10mm;border:1.6pt solid #000;display:flex;flex-direction:column;gap:2.8mm;overflow:hidden;position:relative}
.cut{height:0;border-top:1pt dashed #000;position:relative;margin:0}
.cut span{position:absolute;left:50%;top:-7pt;transform:translateX(-50%);background:#fff;font-size:8pt;padding:0 4pt}
.head{display:flex;gap:4mm;align-items:center}
.num{width:24mm;height:24mm;border:3pt solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 42pt/1 'Noto Sans TC','Noto Sans CJK TC',sans-serif;flex:0 0 auto}
.num.inv{background:#000;color:#fff}
.t1{font-size:24pt;font-weight:900;line-height:1.1}
.t2{font-size:14pt;font-weight:700}
.full{font-size:12pt;border-left:3pt solid #000;padding-left:3mm;line-height:1.35}
.lab{font-size:11pt;font-weight:900;letter-spacing:.5pt;text-transform:uppercase;border-bottom:.8pt solid #000;padding-bottom:.6mm}
ol{padding-left:7mm;font-size:11pt;line-height:1.28}
ol li{margin-bottom:1.3mm}
ol li .zh{display:block;font-size:11pt;font-weight:700}
.who{font-size:11.5pt;line-height:1.35}
.keys{display:flex;flex-wrap:wrap;gap:1.6mm}
.keys span{border:1.2pt solid #000;border-radius:2mm;padding:1mm 2.6mm;font-size:12pt;font-weight:700}
.foot{position:absolute;right:8mm;bottom:5mm;font-size:9pt}
table{border-collapse:collapse;width:100%;font-size:12pt;line-height:1.35}
td{border:.8pt solid #000;padding:1.6mm 2.4mm;vertical-align:top}
td:first-child{font-weight:900;width:28mm}
.script{font-size:13pt;line-height:1.4}
.script b{font-weight:900}
  .sup table{font-size:9.6pt;line-height:1.25} .sup td{padding:.8mm 1.8mm} .sup .script,.sup .who{font-size:10.5pt}
.job{border:2pt solid #000;border-radius:3mm;padding:2mm 3.5mm;font-size:10.5pt;line-height:1.4;background:#f2f2f2}
.job b{font-weight:900}
.turn{display:flex;flex-direction:column;gap:1.8mm}
.turn .st{display:flex;gap:3mm;align-items:flex-start;border:1.6pt solid #000;border-radius:3mm;padding:1.4mm 3mm}
.turn .n{width:13mm;height:13mm;border-radius:50%;background:#000;color:#fff;font:900 20pt/13mm sans-serif;text-align:center;flex:0 0 auto}
.turn .h{font-size:13pt;font-weight:900}
.turn .w{font-size:11pt;font-weight:700}
.turn .d{font-size:10.5pt;line-height:1.28}
.fing{display:grid;grid-template-columns:repeat(2,1fr);gap:3mm;font-size:11pt}
.fing div{border:1.2pt solid #000;border-radius:2mm;padding:2mm 3mm}
.avh{width:16mm;flex:0 0 16mm}
.names{border:1.2pt solid #000;border-radius:2mm;padding:1mm 3mm;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4mm;align-items:end}
.names>b{font-size:9.5pt;line-height:1.15}
.nl span{display:block;font-size:7.5pt}
.nl i{display:block;border-bottom:1pt solid #000;height:6mm}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.rc{border:1.4pt solid #000;border-radius:3mm;padding:2mm;text-align:center;display:flex;flex-direction:column;align-items:center}
.rc .av{width:26mm}
.rn{font-weight:900;font-size:12.5pt;line-height:1.15;margin-top:1mm}
.rh{font-size:9pt;font-weight:900;margin-top:1mm;border-top:.8pt solid #000;padding-top:1mm;width:100%}
.rd{font-size:9pt;line-height:1.3;margin-top:.8mm}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar">
  <b>Printable sheets 列印用卡片</b>
  <span>Each group of 8 needs one set: Roles page, Dispatcher Card, Expert Sheets 1–6 and Supervisor Card (9 A4 pages). Black and white.
  每組一套：角色頁、派案員卡、專家卡1–6與督導卡（9張A4），黑白列印即可。</span>
  <label>Sets 份數 <input id="sets" type="number" min="1" max="12" value="1" style="width:56px;font-size:16px"></label>
  <button onclick="print()">🖨 Print 列印</button>
</div>
<div id="out"></div>
<script src="data.js"></script>
<script src="avatars.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function expert(s){
  return `<div class="card">
    <div class="head"><div class="avh">${AVATARS[s.n]}</div>
      <div><div class="t1">Expert ${s.n} 專家卡 · ${s.zh}</div><div class="t2">Strategy ${s.n}: ${esc(s.en)}</div></div></div>${nameLines()}
    <div class="job"><b>Your job every turn 每一題你要做的：</b> 🔎 Search this sheet in silence → ✋ show your answer with fingers → 🗣 if a line here matches, read it aloud: "Sheet ${s.n}, line __ says…"<br>
      安靜找這張卡 → 用手指比答案 → 有相符的一行就唸出來：「專家卡${s.n}第__行寫…」</div>
    <div class="full">${esc(s.fullEn)}<br><b>${esc(s.fullZh)}</b></div>
    <div class="lab">Who it helps 服務對象</div>
    <div class="who">${esc(s.who)}</div>
    <div class="lab">On my sheet: read the line aloud as proof 我的證據：答題時唸出這一行</div>
    <ol>${s.items.map(it=>`<li>${esc(it[0])}<span class="zh">${esc(it[1])}</span></li>`).join('')}</ol>
    <div class="lab">Exam keywords 考試關鍵字</div>
    <div class="keys">${s.keys.map(k=>`<span>${esc(k)}</span>`).join('')}</div>
    <div class="foot">Safety Net Dispatch 社安網派案中心 · Source: 強化社會安全網計畫2.0（115–119年）</div>
  </div>`;
}
function supervisor(){
  return `<div class="card sup">
    <div class="head"><div class="avh">${AVATARS.sup}</div>
      <div><div class="t1">Supervisor Card 督導卡</div><div class="t2">You approve every answer. Your job is to ask "Why?" 每題都由你核可；你的工作是問「為什麼？」</div></div></div>${nameLines()}
    <div class="job"><b>Your job every turn 每一題你要做的：</b> 🔎 Search this card too (family types, clocks and facts are only here) → ✋ show your answer with fingers →
      🧐 ask "Which line proves it?" → choose the answer with the best proof (or the majority) → tap <b>Supervisor approves</b>.<br>
      也要找這張卡（三類家庭、時限、重點只在這裡）→ 比手指 → 問「哪一行可以證明？」→ 選證據最好（或多數）的答案 → 按「督導核可」。<br>
      <b>Essay round 申論：</b> you may say no to any tile without a good reason. 沒有好理由的卡可以否決。</div>
    <div class="lab">Quick facts 計畫重點</div>
    <table>${FACTS.map(f=>`<tr><td>${esc(f[0])}</td><td><b>${esc(f[1])}</b><br>${esc(f[2])}</td></tr>`).join('')}</table>
    <div class="lab">Three family types 三類家庭</div>
    <div class="who"><b>General 一般家庭</b>: no risk factors 無風險因子 · <b>Vulnerable 脆弱家庭</b>: many stresses, no violence → Social Welfare Service Center 社福中心 ·
      <b>Crisis 危機家庭</b>: violence or abuse = protective case 保護性案件 → 家防中心</div>
    <div class="lab">Clocks 時限</div>
    <div class="who">Report sorted 通報分流: <b>24 hours</b> (under 18 or high-risk adult 未滿18歲、高危成人) · <b>3 days</b> (other adults 非高危成人) ·
      Social Welfare Service Center 社福中心: visit within <b>10 days</b>, assessment within <b>30 days</b> 10日內訪視、30日內評估</div>
    <div class="foot">Safety Net Dispatch 社安網派案中心</div>
  </div>`;
}
function turnPage(){
  return `<div class="card turn">
    <div class="head"><div class="avh">${AVATARS.disp}</div><div><div class="t1">Dispatcher Card 派案員卡</div><div class="t2">How a turn works 一題怎麼玩 · Keep this card next to the tablet. 這張卡放在平板旁邊。</div></div></div>${nameLines()}
    ${STEPS.map((st,k)=>`<div class="st"><div class="n">${k+1}</div><div><div class="h">${st.icon} ${st.en} ${st.zh}</div><div class="w">Who 誰：${st.who[0]} ${st.who[1]}</div>
      <div class="d">${esc(st.do[0])}<br><b>${esc(st.do[1])}</b></div></div></div>`).join('')}
    <div class="lab">Fingers 手指</div>
    <div class="fing"><div><b>Round 1:</b> 1–6 fingers = Strategy 1–6<br>第一回合：比1–6＝策略1–6</div>
      <div><b>Round 2 and Lightning:</b> 1–4 fingers = option 1–4 on screen<br>第二回合與快問快答：比1–4＝畫面上的選項1–4</div></div>
    <div class="lab">Essay builder 申論組裝</div>
    <div class="who">The dispatcher keeps the tablet. Go clockwise, starting with the person on the dispatcher's left. Each person calls out one tile, which part it goes in, and one reason. The supervisor may say no. 派案員拿平板；從派案員左邊的人開始順時針，每人說出一張卡、放哪一段、一個理由；督導可以否決。</div>
    <div class="foot">Safety Net Dispatch 社安網派案中心</div>
  </div>`;
}
function nameLines(){
  return `<div class="names"><b>Name<br>姓名</b>${[['Tutorial + Round 1','教學＋第一回合'],['Round 2','第二回合'],['Round 3','第三回合']].map(x=>`<div class="nl"><span>${x[0]} ${x[1]}</span><i></i></div>`).join('')}</div>`;
}
function rolesPage(){
  return `<div class="card">
    <div class="head"><div class="num inv">8</div><div><div class="t1">Roles 角色</div><div class="t2">Eight people, eight handouts. Your handout is your role. 八個人、八張卡：拿到哪張卡，就是你的角色。</div></div></div>
    <div class="job"><b>1.</b> Each person takes one handout and writes their name on it. 每人拿一張卡，寫上自己的名字。<br>
      <b>2.</b> ${esc(SWAP_RULE[0])}<br>${esc(SWAP_RULE[1])}</div>
    <div class="rgrid">${ROLE_INFO.map(x=>`<div class="rc"><div class="av">${AVATARS[x.k]}</div><div class="rn">${x.en}<br>${x.zh}</div>
      <div class="rh">${x.card[0]} ${x.card[1]}</div><div class="rd">${esc(x.do[0])}<br>${esc(x.do[1])}</div></div>`).join('')}</div>
    <div class="lab">Passing to the left 傳給左邊</div>
    <div class="who">Tutorial + Round 1 → swap → Round 2 → swap → Round 3. The tablet screen says when to swap. 教學＋第一回合 → 交換 → 第二回合 → 交換 → 第三回合；平板會提醒何時交換。</div>
    <div class="foot">Safety Net Dispatch 社安網派案中心</div>
  </div>`;
}
function build(){
  const n=Math.max(1,Math.min(12,+document.getElementById('sets').value||1));
  const cards=[rolesPage(), turnPage(), ...STRATS.map(expert), supervisor()];
  let html='';
  for(let k=0;k<n;k++){
    for(const c of cards) html+=`<div class="page">${c}</div>`;
  }
  document.getElementById('out').innerHTML=html;
}
document.getElementById('sets').oninput=build;
build();
</script>
</body>
</html>
